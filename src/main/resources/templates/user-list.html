<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        a, button {
            text-decoration: none;
            color: #3498db;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
        }

        a:hover, button:hover {
            text-decoration: underline;
        }

        .alert {
            color: red;
            font-weight: bold;
            font-size: 16px;
        }

        .logout-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logout-button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-button:hover {
            background-color: #c0392b;
        }

        .create-user-link {
            margin-top: 10px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .create-user-link:hover {
            background-color: #27ae60;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="logout-container">
    <h1>User Management</h1>
    <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button type="submit" class="logout-button" aria-label="Logout">Logout</button>
    </form>
</div>

<div th:switch="${users}">
    <h2 th:case="null" class="alert">No users found!</h2>
    <div th:case="*">
        <h2>Users</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.firstName}"></td>
                <td th:text="${user.lastName}"></td>
                <td th:text="${user.age}"></td>
                <td th:text="${user.role}"></td>
                <td class="actions">
                    <a th:href="@{/admin/user-update(id=${user.id})}" title="Edit User" aria-label="Edit User">Edit</a> |
                    <a th:href="@{/admin/user-delete(id=${user.id})}" title="Delete User" aria-label="Delete User"
                       onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p>
        <a th:href="@{/admin/user-create}" class="create-user-link" title="Create New User">Create New User</a>
    </p>
</div>
</body>
</html>
